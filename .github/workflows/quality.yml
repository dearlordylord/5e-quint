name: Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Runs do not cancel each other: classifier completion order can differ from
# push order, and an older candidate must never cancel newer qualification.
jobs:
  classify:
    name: Classify receipt changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Check classifier
        run: node --test scripts/classify-quality-receipt.test.mjs
      - id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/classify-quality-receipt.mjs

  quality:
    name: Resource-bounded workspace quality
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install ripgrep
        env:
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          RIPGREP_VERSION: 14.1.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          install_dir="$RUNNER_TEMP/ripgrep"
          asset="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${asset}.tar.gz" \
            --output "$archive"
          echo "$RIPGREP_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/rg" --version

      - name: Install Dhall JSON
        run: |
          set -euo pipefail
          mapfile -t dhall_json_toolchain < <(
            node -e '
              const toolchain = require("./packages/surface/dhall-json-toolchain.json")
              console.log(toolchain.dhallHaskellRelease)
              console.log(toolchain.dhallJsonVersion)
              console.log(toolchain.linuxX64ArchiveSha256)
            '
          )
          dhall_haskell_release="${dhall_json_toolchain[0]}"
          dhall_json_version="${dhall_json_toolchain[1]}"
          dhall_json_sha256="${dhall_json_toolchain[2]}"
          archive="$RUNNER_TEMP/dhall-json.tar.bz2"
          install_dir="$RUNNER_TEMP/dhall-json"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/dhall-lang/dhall-haskell/releases/download/${dhall_haskell_release}/dhall-json-${dhall_json_version}-x86_64-linux.tar.bz2" \
            --output "$archive"
          echo "$dhall_json_sha256  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xjf "$archive" -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          installed_version="$("$install_dir/bin/dhall-to-json" --version)"
          test "$installed_version" = "$dhall_json_version"
          echo "dhall-to-json $installed_version"

      - name: Restrict tunnel device for deterministic verification
        run: |
          if [[ -e /dev/net/tun ]]; then
            sudo chmod 000 /dev/net/tun
          fi

      - name: Run receipt document and certificate checks
        if: needs.classify.outputs.lane == 'receipt'
        run: |
          pnpm rules-kernel-coverage:check
          pnpm unit-profile-coverage:check
          pnpm check:test-lane-hygiene
          pnpm check:markdown-links
          pnpm check:cleanroom-provenance
          . scripts/resource-lock-owner.sh
          with_resource_lock_owner scripts/with-broad-workspace-lock.sh pnpm check:surface-publication-delta
          with_resource_lock_owner scripts/with-broad-workspace-lock.sh pnpm check:effect4-oracle-delta

      - name: Run workspace quality gate
        if: needs.classify.outputs.lane != 'receipt'
        run: pnpm quality:milestone
