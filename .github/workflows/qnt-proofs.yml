name: QNT proofs

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/qnt-proofs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/*.qnt"
      - "packages/**/package.json"
      - "packages/**/src/**/*qnt-proof*.ts"
      - "scripts/**/*qnt*.cjs"
      - "scripts/**/*qnt*.ts"
  pull_request:
    paths:
      - ".github/workflows/qnt-proofs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/*.qnt"
      - "packages/**/package.json"
      - "packages/**/src/**/*qnt-proof*.ts"
      - "scripts/**/*qnt*.cjs"
      - "scripts/**/*qnt*.ts"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qnt-proofs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: QNT proof lane (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # Battle-runtime proof modules are serial within one Vitest worker.
          # Round-robin shards keep the measured expensive modules distributed
          # while preserving complete, deterministic module coverage.
          - lane: battle-runtime-0
            package: "@dnd/battle-runtime"
            script: test:qnt-proofs
            shard_index: "0"
            shard_count: "4"
            timing: true
          - lane: battle-runtime-1
            package: "@dnd/battle-runtime"
            script: test:qnt-proofs
            shard_index: "1"
            shard_count: "4"
            timing: true
          - lane: battle-runtime-2
            package: "@dnd/battle-runtime"
            script: test:qnt-proofs
            shard_index: "2"
            shard_count: "4"
            timing: true
          - lane: battle-runtime-3
            package: "@dnd/battle-runtime"
            script: test:qnt-proofs
            shard_index: "3"
            shard_count: "4"
            timing: true
          - lane: shared-algebras
            package: "@dnd/shared-algebras"
            script: proof:quint
            shard_index: ""
            shard_count: ""
            timing: true
          - lane: character-creation-slice
            package: "@dnd/character-creation-runtime"
            script: test:qnt-slice
            shard_index: ""
            shard_count: ""
            timing: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Quint CLI
        run: |
          pnpm add --global @informalsystems/quint@0.31.0
          pnpm exec quint --version

      - name: Download previous successful timing artifact
        if: matrix.timing
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_ARTIFACT_NAME: qnt-proof-timings-${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p proof-artifacts/previous
          for comparison_branch in \
            "${GITHUB_HEAD_REF:-}" \
            "${GITHUB_BASE_REF:-}" \
            "${GITHUB_REF_NAME:-}"; do
            if test -z "$comparison_branch"; then
              continue
            fi
            if ! previous_run_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs" \
                --method GET \
                -f branch="$comparison_branch" \
                -f status=success \
                -f per_page=100 \
                --jq '[.workflow_runs[] | select(.name == "QNT proofs")][0].id // empty'
            )"; then
              echo "::warning::Could not query prior QNT proof timings for $comparison_branch."
              continue
            fi
            if test -n "$previous_run_id" && \
              gh run download "$previous_run_id" \
                --name "$TIMING_ARTIFACT_NAME" \
                --dir proof-artifacts/previous; then
              echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run_id=" >> "$GITHUB_OUTPUT"

      - name: Run QNT inventory and closure checks
        run: |
          set -euo pipefail
          pnpm check:qnt-inventory
          pnpm check:mbt-driver-closure
          pnpm check:qnt-proof-closure

      - name: Run bounded proof lane
        shell: bash
        env:
          QNT_PROOF_SHARD_INDEX: ${{ matrix.shard_index }}
          QNT_PROOF_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          mkdir -p proof-artifacts/current
          pnpm --filter "${{ matrix.package }}" "${{ matrix.script }}" \
            2> >(tee proof-artifacts/current/qnt-proof-events.log >&2)

      - name: Build timing comparison
        if: always() && matrix.timing
        shell: bash
        run: |
          set -euo pipefail
          report_args=(
            --events proof-artifacts/current/qnt-proof-events.log
            --out proof-artifacts/current/qnt-proof-timings.json
          )
          if test -f proof-artifacts/previous/qnt-proof-timings.json; then
            report_args+=(
              --previous proof-artifacts/previous/qnt-proof-timings.json
            )
          fi
          node scripts/qnt-proof-timing-report.cjs "${report_args[@]}" \
            | tee proof-artifacts/current/qnt-proof-timings.md
          cat proof-artifacts/current/qnt-proof-timings.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof events and timings
        if: always() && matrix.timing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qnt-proof-timings-${{ matrix.lane }}
          path: proof-artifacts/current/
          if-no-files-found: warn
          retention-days: 30

  proof-gate:
    name: Bounded QNT proof lane
    if: always()
    needs: proofs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every proof lane to pass
        if: needs.proofs.result != 'success'
        run: |
          echo "::error::QNT proof matrix result was ${{ needs.proofs.result }}."
          exit 1

      - name: Confirm all proof lanes passed
        if: needs.proofs.result == 'success'
        run: echo "All QNT proof lanes passed."
