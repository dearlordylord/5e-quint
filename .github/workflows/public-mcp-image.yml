name: Public MCP image

on:
  workflow_dispatch:
    inputs:
      release:
        description: Full Git commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Build deployable image off-host
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ inputs.release }}

      - name: Verify immutable release
        env:
          EXPECTED_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          build-args: DND_MCP_RELEASE=${{ inputs.release }}
          context: .
          file: operations/public-mcp/Dockerfile
          load: true
          tags: dnd-oracle:${{ inputs.release }}

      - name: Export deployable image
        env:
          RELEASE: ${{ inputs.release }}
        run: docker image save --output dnd-oracle-image.tar "dnd-oracle:$RELEASE"

      - name: Upload deployable image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: dnd-oracle-image
          path: dnd-oracle-image.tar
          retention-days: 7
